name: Build macOS experimental Steam API

on:
  push:
    tags:
      - 'macos-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
      - name: Build
        run: ./build_mac/build.sh '${{ matrix.arch }}'
      - name: Package
        run: |
          tar -czf 'libsteam_api-macos-${{ matrix.arch }}.tar.gz' \
            -C 'dist/macos/${{ matrix.arch }}' libsteam_api.dylib
          shasum -a 256 'libsteam_api-macos-${{ matrix.arch }}.tar.gz' \
            > 'libsteam_api-macos-${{ matrix.arch }}.tar.gz.sha256'
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            libsteam_api-macos-${{ matrix.arch }}.tar.gz
            libsteam_api-macos-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
